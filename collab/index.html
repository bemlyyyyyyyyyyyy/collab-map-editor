}

// ─── Event Handlers (Mouse) ───
function handleMouseDown(e) {
    if (e.button === 2) { isPanning = true; panStart = { x: e.clientX, y: e.clientY }; return; }

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const cellSizeScaled = CELL_SIZE * zoom;
    const cell = getCellFromPosition(x, y, cellSizeScaled);

    if (currentMode === 'move') {
        const item = findMovableItemAt(cell.x, cell.y);
        if (item) { isMovingItem = true; movingItem = item; movingStartCell = cell; }
        else { isPanning = true; panStart = { x: e.clientX, y: e.clientY }; }
        return;
    }

    if (currentMode === 'text') { openTextModal(cell); return; }

    if (currentMode === 'space-station') {
        if (pendingSpaceStationSize) {
            if (!requirePermission('place')) return;
            const snappedCell = snapToGrid10x10(cell);
            let plan = { x: snappedCell.x, y: snappedCell.y, color: currentColor, name: '', type: '空间站', docking: '', note: '', canOverlap: false, shape: 'square', width: pendingSpaceStationSize.width, height: pendingSpaceStationSize.height };
            if (!checkOverlap(plan)) { plans.push(plan); sendMessage({ type: 'place_plan', plan: JSON.parse(JSON.stringify(plan)) }); }
            pendingSpaceStationSize = null;
            drawGrid();
        } else { openPlanModal(cell, 40); }
    } else if (currentMode === 'building' || currentMode === 'building-10' || currentMode === 'building-20') {
        isDragging = true; selectionStart = cell; selectionEnd = cell; updateSelection();
    } else if (currentMode === 'plan-circle' || currentMode === 'delegation-circle' || currentMode === 'warp-circle') {
        if (!requirePermission('place')) return;
        const planConfig = PLAN_TYPES[currentMode];
        let plan = { x: cell.x, y: cell.y, color: currentColor, name: '', type: currentMode === 'plan-circle' ? selectedPlanCircleType : getDefaultTypeName(currentMode), docking: '', note: '', canOverlap: planConfig.canOverlap };
        if (currentMode === 'plan-circle') { plan.shape = 'circle'; plan.radius = 5; plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius; }
        else if (currentMode === 'delegation-circle') { plan.shape = 'delegation'; plan.radius = 15; plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius; }
        else if (currentMode === 'warp-circle') { plan.shape = 'warp'; plan.direction = pendingWarpDirection || 0; pendingWarpDirection = 0; }
        plans.push(plan);
        sendMessage({ type: 'place_plan', plan: JSON.parse(JSON.stringify(plan)) });
        drawGrid();
    } else if (currentMode === 'marker' || currentMode.startsWith('marker-')) {
        if (!requirePermission('place')) return;
        const item = findMovableItemAt(cell.x, cell.y);
        if (item && item.type === 'marker') {
            markers.splice(item.index, 1);
            sendMessage({ type: 'delete_marker', index: item.index });
        } else {
            const m = { x: cell.x, y: cell.y, type: selectedMarkerType, color: currentColor, name: '' };
            markers.push(m);
            sendMessage({ type: 'place_marker', marker: m });
        }
        drawGrid();
    } else if (currentMode === 'route-curve' || currentMode === 'route-normal') {
        if (!requirePermission('place')) return;
        if (!routeStart) { routeStart = cell; }
        else {
            const r = { start: routeStart, end: cell, color: currentColor, type: currentMode === 'route-curve' ? 'curve' : 'normal' };
            routes.push(r);
            routeStart = null;
            sendMessage({ type: 'place_route', route: r });
            drawGrid();
        }
    }
}

function handleMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    updateCoords(x, y);

    if (isPanning) {
        const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
        offsetX += dx; offsetY += dy;
        panStart = { x: e.clientX, y: e.clientY };
        drawGrid(); updateSelection();
        return;
    }

    if (isMovingItem && movingItem) {
        const cellSizeScaled = CELL_SIZE * zoom;
        const cell = getCellFromPosition(x, y, cellSizeScaled);
        const dx = cell.x - movingStartCell.x, dy = cell.y - movingStartCell.y;
        moveItem(movingItem, dx, dy);
        movingStartCell = cell;
        drawGrid();
        return;
    }

    if (!isDragging && !isPanning) {
        mousePreviewCell = getCellFromPosition(x, y, CELL_SIZE * zoom);
        drawGrid();
    }

    if (!isDragging) return;

    const cellSizeScaled = CELL_SIZE * zoom;
    let cell = getCellFromPosition(x, y, cellSizeScaled);
    if (PLAN_TYPES[currentMode]?.snapToGrid) cell = snapToGrid10x10(cell);
    selectionEnd = cell;
    updateSelection();
}

function handleMouseUp() {
    if (isPanning) { isPanning = false; return; }
    if (isMovingItem) {
        if (movingItem) { drawGrid(); syncMoveItem(movingItem); }
        isMovingItem = false; movingItem = null; movingStartCell = null;
        return;
    }

    if (isDragging && selectionStart && selectionEnd) {
        if (!requirePermission('place')) { isDragging = false; selectionStart = null; selectionEnd = null; updateSelection(); return; }
        const minX = Math.min(selectionStart.x, selectionEnd.x), maxX = Math.max(selectionStart.x, selectionEnd.x);
        const minY = Math.min(selectionStart.y, selectionEnd.y), maxY = Math.max(selectionStart.y, selectionEnd.y);
        let width = maxX - minX + 1, height = maxY - minY + 1;
        if (currentMode === 'space-station') {
            width = Math.max(width, 40); height = Math.max(height, 40);
            if (width % 10 !== 0) width = Math.ceil(width / 10) * 10;
            if (height % 10 !== 0) height = Math.ceil(height / 10) * 10;
        } else if (currentMode === 'building' || currentMode === 'building-10' || currentMode === 'building-20') {
            width = currentMode === 'building-20' ? 20 : 10; height = width;
        }
        const finalCell = { x: minX, y: minY };
        if (PLAN_TYPES[currentMode === 'space-station' ? 'space-station' : 'building']?.snapToGrid) {
            finalCell.x = Math.floor(minX / 10) * 10; finalCell.y = Math.floor(minY / 10) * 10;
        }
        openPlanModal(finalCell, Math.max(width, height));
    }

    isDragging = false; selectionStart = null; selectionEnd = null; updateSelection();
}

function handleContextMenu(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const cell = getCellFromPosition(x, y, CELL_SIZE * zoom);
    const item = findItemAt(cell.x, cell.y);
    ctxMenuTarget = item;
    document.getElementById('ctxEdit').style.display = item?.type === 'plan' ? 'block' : 'none';
    document.getElementById('ctxChangeColor').style.display = (item?.type === 'plan' || item?.type === 'route') ? 'block' : 'none';
    document.getElementById('ctxSwitchRoute').style.display = item?.type === 'route' ? 'block' : 'none';
    document.getElementById('ctxCopyCoord').style.display = 'block';
    document.getElementById('ctxDelete').style.display = item?.type !== 'coord' ? 'block' : 'none';
    document.getElementById('contextMenu').querySelector('hr').style.display = item?.type !== 'coord' ? 'block' : 'none';
    document.getElementById('contextMenu').style.left = e.clientX + 'px';
    document.getElementById('contextMenu').style.top = e.clientY + 'px';
    document.getElementById('contextMenu').classList.add('show');
}

// ─── Touch Events ───
let touchStartPos = null, touchStartTime = 0, touchMoved = false;
let lastTouchDistance = null, pinchCenter = null, longPressTimer = null;
let isPinching = false, touchPanStart = null;
const TAP_THRESHOLD = 10, TAP_MAX_TIME = 300, LONG_PRESS_TIME = 500;

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function handleTouchTap(touchPos) {
    const rect = canvas.getBoundingClientRect();
    const x = touchPos.x - rect.left, y = touchPos.y - rect.top;
    const cellSizeScaled = CELL_SIZE * zoom;
    const cell = getCellFromPosition(x, y, cellSizeScaled);

    if (currentMode === 'text') { openTextModal(cell); }
    else if (currentMode === 'space-station') {
        if (pendingSpaceStationSize) {
            if (!requirePermission('place')) return;
            const snappedCell = snapToGrid10x10(cell);
            let plan = { x: snappedCell.x, y: snappedCell.y, color: currentColor, name: '', type: '空间站', docking: '', note: '', canOverlap: false, shape: 'square', width: pendingSpaceStationSize.width, height: pendingSpaceStationSize.height };
            if (!checkOverlap(plan)) { plans.push(plan); sendMessage({ type: 'place_plan', plan: JSON.parse(JSON.stringify(plan)) }); }
            pendingSpaceStationSize = null;
            drawGrid();
        } else { openPlanModal(cell, 40); }
    } else if (currentMode === 'building' || currentMode === 'building-10' || currentMode === 'building-20') {
        openPlanModal(cell, currentMode === 'building-20' ? 20 : 10);
    } else if (currentMode === 'plan-circle' || currentMode === 'delegation-circle' || currentMode === 'warp-circle') {
        if (!requirePermission('place')) return;
        const planConfig = PLAN_TYPES[currentMode];
        let plan = { x: cell.x, y: cell.y, color: currentColor, name: '', type: currentMode === 'plan-circle' ? selectedPlanCircleType : getDefaultTypeName(currentMode), docking: '', note: '', canOverlap: planConfig.canOverlap };
        if (currentMode === 'plan-circle') { plan.shape = 'circle'; plan.radius = 5; plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius; }
        else if (currentMode === 'delegation-circle') { plan.shape = 'delegation'; plan.radius = 15; plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius; }
        else if (currentMode === 'warp-circle') { plan.shape = 'warp'; plan.direction = pendingWarpDirection || 0; pendingWarpDirection = 0; }
        plans.push(plan);
        sendMessage({ type: 'place_plan', plan: JSON.parse(JSON.stringify(plan)) });
        drawGrid();
    } else if (currentMode === 'marker' || currentMode.startsWith('marker-')) {
        if (!requirePermission('place')) return;
        const item = findMovableItemAt(cell.x, cell.y);
        if (item && item.type === 'marker') {
            markers.splice(item.index, 1);
            sendMessage({ type: 'delete_marker', index: item.index });
        } else {
            const m = { x: cell.x, y: cell.y, type: selectedMarkerType, color: currentColor, name: '' };
            markers.push(m);
            sendMessage({ type: 'place_marker', marker: m });
        }
        drawGrid();
    } else if (currentMode === 'route-curve' || currentMode === 'route-normal') {
        if (!requirePermission('place')) return;
        if (!routeStart) { routeStart = cell; }
        else {
            const r = { start: routeStart, end: cell, color: currentColor, type: currentMode === 'route-curve' ? 'curve' : 'normal' };
            routes.push(r);
            routeStart = null;
            sendMessage({ type: 'place_route', route: r });
            drawGrid();
        }
    } else if (currentMode === 'move') {
        const item = findMovableItemAt(cell.x, cell.y);
        if (item) { isMovingItem = true; movingItem = item; movingStartCell = cell; }
    }
}

function initTouchEvents() {
    canvas.addEventListener('touchstart', (e) => {
        touchStartTime = Date.now(); touchMoved = false;
        if (e.touches.length === 1) {
            const t = e.touches[0];
            touchStartPos = { x: t.clientX, y: t.clientY };
            touchPanStart = { x: t.clientX, y: t.clientY };
            lastTouchDistance = null; isPinching = false;
            const touchPos = { x: t.clientX, y: t.clientY };
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                if (!touchMoved) {
                    const rect = canvas.getBoundingClientRect();
                    const cell = getCellFromPosition(touchPos.x - rect.left, touchPos.y - rect.top, CELL_SIZE * zoom);
                    const item = findItemAt(cell.x, cell.y);
                    ctxMenuTarget = item;
                    showContextMenuForItem(item, touchPos.x, touchPos.y);
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, LONG_PRESS_TIME);
        } else if (e.touches.length === 2) {
            clearTimeout(longPressTimer); isPinching = true;
            lastTouchDistance = getTouchDistance(e.touches);
            const rect = canvas.getBoundingClientRect();
            pinchCenter = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top };
        }
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2 && lastTouchDistance) {
            const currentDistance = getTouchDistance(e.touches);
            const delta = currentDistance / lastTouchDistance;
            const newZoom = Math.max(0.05, Math.min(5, zoom * delta));
            const rect = canvas.getBoundingClientRect();
            const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
            const worldX = (centerX - offsetX) / zoom, worldY = (centerY - offsetY) / zoom;
            zoom = newZoom;
            offsetX = centerX - worldX * zoom; offsetY = centerY - worldY * zoom;
            lastTouchDistance = currentDistance;
            drawGrid();
        } else if (e.touches.length === 1 && touchStartPos && !isPinching) {
            const dx = e.touches[0].clientX - touchStartPos.x, dy = e.touches[0].clientY - touchStartPos.y;
            if (Math.abs(dx) > TAP_THRESHOLD || Math.abs(dy) > TAP_THRESHOLD) { touchMoved = true; clearTimeout(longPressTimer); }
            if (touchMoved) {
                if (currentMode === 'move' && !isMovingItem) {
                    if (touchPanStart) { offsetX += dx; offsetY += dy; }
                } else if (currentMode === 'move' && isMovingItem && movingItem) {
                    const cellSizeScaled = CELL_SIZE * zoom;
                    const rect = canvas.getBoundingClientRect();
                    const cell = getCellFromPosition(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top, cellSizeScaled);
                    if (movingStartCell) {
                        const ddx = cell.x - movingStartCell.x, ddy = cell.y - movingStartCell.y;
                        moveItem(movingItem, ddx, ddy);
                        movingStartCell = cell;
                    }
                } else if (currentMode === 'building' || currentMode === 'building-10' || currentMode === 'building-20' || currentMode === 'space-station') {
                    if (!isDragging) {
                        isDragging = true;
                        const rect = canvas.getBoundingClientRect();
                        const cellSizeScaled = CELL_SIZE * zoom;
                        selectionStart = getCellFromPosition(touchStartPos.x - rect.left, touchStartPos.y - rect.top, cellSizeScaled);
                        if (PLAN_TYPES[currentMode]?.snapToGrid) selectionStart = snapToGrid10x10(selectionStart);
                    }
                    const rect = canvas.getBoundingClientRect();
                    const cellSizeScaled = CELL_SIZE * zoom;
                    selectionEnd = getCellFromPosition(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top, cellSizeScaled);
                    if (PLAN_TYPES[currentMode]?.snapToGrid) selectionEnd = snapToGrid10x10(selectionEnd);
                    updateSelection();
                } else {
                    offsetX += dx; offsetY += dy;
                }
                if (touchPanStart) touchPanStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                drawGrid();
            }
        }
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        clearTimeout(longPressTimer);
        if (e.touches.length === 0) {
            const touchDuration = Date.now() - touchStartTime;
            if (isPinching) { isPinching = false; lastTouchDistance = null; touchStartPos = null; touchPanStart = null; return; }
            if (isMovingItem) { if (movingItem) syncMoveItem(movingItem); isMovingItem = false; movingItem = null; movingStartCell = null; touchStartPos = null; touchPanStart = null; return; }
            if (isDragging && selectionStart && selectionEnd) {
                const minX = Math.min(selectionStart.x, selectionEnd.x), maxX = Math.max(selectionStart.x, selectionEnd.x);
                const minY = Math.min(selectionStart.y, selectionEnd.y), maxY = Math.max(selectionStart.y, selectionEnd.y);
                let width = maxX - minX + 1, height = maxY - minY + 1;
                if (currentMode === 'space-station') { width = Math.max(width, 40); height = Math.max(height, 40); }
                else if (currentMode === 'building-20') { width = 20; height = 20; }
                else { width = 10; height = 10; }
                const finalCell = { x: minX, y: minY };
                if (PLAN_TYPES[currentMode]?.snapToGrid) { finalCell.x = Math.floor(minX / 10) * 10; finalCell.y = Math.floor(minY / 10) * 10; }
                openPlanModal(finalCell, Math.max(width, height));
                isDragging = false; selectionStart = null; selectionEnd = null; updateSelection();
                touchStartPos = null; touchPanStart = null;
                return;
            }
            isDragging = false; selectionStart = null; selectionEnd = null; updateSelection();
            if (!touchMoved && touchDuration < TAP_MAX_TIME && touchStartPos) handleTouchTap(touchStartPos);
            touchStartPos = null; touchPanStart = null; lastTouchDistance = null;
        } else if (e.touches.length === 1) {
            touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            touchPanStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            isPinching = false; lastTouchDistance = null;
        }
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => {
        clearTimeout(longPressTimer);
        isDragging = false; isPinching = false; isMovingItem = false;
        movingItem = null; movingStartCell = null;
        selectionStart = null; selectionEnd = null;
        touchStartPos = null; touchPanStart = null; lastTouchDistance = null;
        updateSelection();
    });
}

// ─── Canvas Init ───
function resizeCanvas() {
    if (!canvas || !canvasContainer) return;
    const width = Math.max(canvasContainer.clientWidth, window.innerWidth);
    const height = Math.max(canvasContainer.clientHeight, window.innerHeight - 70);
    canvas.width = width;
    canvas.height = height;
    drawGrid();
}

function initCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    selectionOverlay = document.getElementById('selectionOverlay');
    canvasContainer = document.getElementById('canvasContainer');
    coordsDisplay = document.getElementById('coords');

    resizeCanvas();
    initMarkerGrid();
    initTypeFilterGrid();
    initEventListeners();
    initTouchEvents();

    window.addEventListener('resize', resizeCanvas);
    drawGrid();
}

// ─── Event Listener Init ───
function initEventListeners() {
    // Dropdown toggle for touch devices
    if (window.matchMedia('(pointer: coarse)').matches) {
        document.querySelectorAll('.mode-dropdown .dropdown-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const dropdown = btn.closest('.mode-dropdown');
                const wasOpen = dropdown.classList.contains('open');
                document.querySelectorAll('.mode-dropdown.open').forEach(d => d.classList.remove('open'));
                if (!wasOpen) dropdown.classList.add('open');
            });
        });
        document.addEventListener('click', () => { document.querySelectorAll('.mode-dropdown.open').forEach(d => d.classList.remove('open')); });
    }

    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('dropdown-btn')) return;
            document.querySelectorAll('.mode-btn').forEach(b => { if (!b.classList.contains('dropdown-btn')) b.classList.remove('active'); });
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            routeStart = null;
            drawGrid();
        });
    });

    // Dropdown items
    document.querySelectorAll('.dropdown-content .mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const parentDropdown = btn.closest('.mode-dropdown');
            if (parentDropdown) {
                const dropdownBtn = parentDropdown.querySelector('.dropdown-btn');
                if (dropdownBtn) dropdownBtn.classList.add('active');
            }
            btn.classList.add('active');
            currentMode = btn.dataset.mode;

            if (currentMode.startsWith('marker-')) {
                selectedMarkerType = currentMode.replace('marker-', '');
            } else if (currentMode.startsWith('plan-circle-')) {
                const planCircleModes = {
                    'plan-circle-normal': '普通计划圈', 'plan-circle-blockade': '封锁计划圈',
                    'plan-circle-warp1': '曲率加速计划1级', 'plan-circle-warp2': '曲率加速计划2级',
                    'plan-circle-auto1': '自动采集计划1级', 'plan-circle-auto2': '自动采集计划2级',
                    'plan-circle-defend1': '防卫警戒计划1级', 'plan-circle-defend2': '防卫警戒计划2级',
                    'plan-circle-space1': '空域改造计划1级', 'plan-circle-space2': '空域改造计划2级'
                };
                selectedPlanCircleType = planCircleModes[currentMode] || '普通计划圈';
                currentMode = 'plan-circle';
            }
            routeStart = null;
            drawGrid();
        });
    });

    // Color buttons
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentColor = btn.dataset.color;
        });
    });

    // Color picker modal
    const colorPickerGrid = document.getElementById('colorPickerGrid');
    const colors = ['#ffffff', '#4a90d9', '#00d4ff', '#4ecdc4', '#ffd93d', '#aa96da', '#ff6b6b', '#ffe66d', '#95e1d3'];
    colors.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.dataset.color = c;
        btn.style.cssText = 'background:' + c + ';width:40px;height:40px;';
        btn.addEventListener('click', () => {
            document.querySelectorAll('#colorPickerGrid .color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
        colorPickerGrid.appendChild(btn);
    });

    let selectedColor = null;
    document.getElementById('colorConfirm').addEventListener('click', () => {
        const active = document.querySelector('#colorPickerGrid .color-btn.active');
        if (active && ctxMenuTarget) {
            if (ctxMenuTarget.type === 'plan') {
                plans[ctxMenuTarget.index].color = active.dataset.color;
                sendMessage({ type: 'edit_plan', index: ctxMenuTarget.index, plan: JSON.parse(JSON.stringify(plans[ctxMenuTarget.index])) });
            } else if (ctxMenuTarget.type === 'route') {
                routes[ctxMenuTarget.index].color = active.dataset.color;
                sendMessage({ type: 'edit_route', index: ctxMenuTarget.index, route: JSON.parse(JSON.stringify(routes[ctxMenuTarget.index])) });
            }
            drawGrid();
        }
        document.getElementById('colorModal').classList.remove('show');
        ctxMenuTarget = null;
        document.querySelectorAll('#colorPickerGrid .color-btn').forEach(b => b.classList.remove('active'));
    });
    document.getElementById('colorCancel').addEventListener('click', () => {
        document.getElementById('colorModal').classList.remove('show');
        ctxMenuTarget = null;
        document.querySelectorAll('#colorPickerGrid .color-btn').forEach(b => b.classList.remove('active'));
    });

    // Toggle info
    document.getElementById('toggleInfoBtn').addEventListener('click', () => {
        showPlanInfo = !showPlanInfo;
        document.getElementById('toggleInfoBtn').textContent = showPlanInfo ? '显示信息' : '隐藏信息';
        drawGrid();
    });

    // Jump to coords
    document.getElementById('jumpBtn').addEventListener('click', () => {
        const input = document.getElementById('coordInput').value.trim();
        const coords = parseCoords(input);
        if (!coords || coords.x < 0 || coords.x >= 9000 || coords.y < 0 || coords.y >= 9000) {
            showToast('请输入有效的坐标，格式如: (6645, 3280) 或 6645, 3280', 'error');
            return;
        }
        const cellSizeScaled = CELL_SIZE * zoom;
        offsetX = canvas.width / 2 - coords.x * cellSizeScaled;
        offsetY = canvas.height / 2 - coords.y * cellSizeScaled;
        drawGrid();
    });
    document.getElementById('coordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('jumpBtn').click(); });

    // Export
    document.getElementById('exportBtn').addEventListener('click', () => {
        const data = { plans, routes, texts, markers, version: '2.0' };
        document.getElementById('exportData').value = JSON.stringify(data, null, 2);
        document.getElementById('exportModal').classList.add('show');
    });

    // Import (admin only)
    document.getElementById('importBtn').addEventListener('click', () => { document.getElementById('importFile').click(); });
    document.getElementById('importFile').addEventListener('change', (e) => {
        if (!requirePermission('edit')) { e.target.value = ''; return; }
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = JSON.parse(event.target.result);
                if (myRole === 'admin') {
                    sendMessage({
                        type: 'import_data',
                        plans: data.plans || plans,
                        routes: data.routes || routes,
                        markers: data.markers || markers,
                        texts: data.texts || texts
                    });
                } else {
                    if (data.plans) plans.forEach(() => {}); // just locally if member
                    if (data.plans) { plans.length = 0; plans.push(...data.plans); }
                    if (data.routes) { routes.length = 0; routes.push(...data.routes); }
                    if (data.texts) { texts.length = 0; texts.push(...data.texts); }
                    if (data.markers) { markers.length = 0; markers.push(...data.markers); }
                    drawGrid();
                }
                showToast('导入成功！', 'info');
            } catch (err) { showToast('导入失败，请确保文件格式正确', 'error'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    // Batch
    document.getElementById('batchBtn').addEventListener('click', () => {
        if (!requirePermission('place')) return;
        document.getElementById('batchCoords').value = '';
        document.getElementById('batchPlanType').value = 'plan-circle';
        document.getElementById('batchTypeName').value = '';
        document.getElementById('batchModal').classList.add('show');
    });
    document.getElementById('batchCancel').addEventListener('click', () => { document.getElementById('batchModal').classList.remove('show'); });

    document.getElementById('batchPreview').addEventListener('click', () => {
        const coordsText = document.getElementById('batchCoords').value.trim();
        if (!coordsText) { showToast('请输入坐标列表', 'error'); return; }
        const planType = document.getElementById('batchPlanType').value;
        const typeName = document.getElementById('batchTypeName').value.trim();
        const coords = coordsText.split('\n').map(line => parseCoords(line)).filter(c => c);
        if (coords.length === 0) { showToast('没有有效的坐标', 'error'); return; }
        document.getElementById('batchPreviewInfo').textContent = '将添加 ' + coords.length + ' 个项目';
        const previewList = document.getElementById('batchPreviewList');
        previewList.innerHTML = '';
        coords.slice(0, 20).forEach(coord => {
            const item = document.createElement('div');
            item.className = 'batch-preview-item';
            item.innerHTML = '<span class="color-indicator" style="background:' + currentColor + ';"></span><span>(' + coord.x + ', ' + coord.y + ')</span>';
            previewList.appendChild(item);
        });
        if (coords.length > 20) {
            const more = document.createElement('div');
            more.textContent = '... 还有 ' + (coords.length - 20) + ' 个';
            more.style.cssText = 'text-align:center;color:rgba(255,255,255,0.5);';
            previewList.appendChild(more);
        }
        document.getElementById('batchModal').classList.remove('show');
        document.getElementById('batchPreviewModal').classList.add('show');
        document.getElementById('batchPreviewConfirm').onclick = () => {
            coords.forEach(coord => addPlanAtCoord(coord, planType, typeName));
            document.getElementById('batchPreviewModal').classList.remove('show');
            drawGrid();
            showToast('已添加 ' + coords.length + ' 个项目', 'info');
        };
    });
    document.getElementById('batchConfirm').addEventListener('click', () => {
        const coordsText = document.getElementById('batchCoords').value.trim();
        if (!coordsText) { showToast('请输入坐标列表', 'error'); return; }
        const planType = document.getElementById('batchPlanType').value;
        const typeName = document.getElementById('batchTypeName').value.trim();
        const coords = coordsText.split('\n').map(line => parseCoords(line)).filter(c => c);
        if (coords.length === 0) { showToast('没有有效的坐标', 'error'); return; }
        coords.forEach(coord => addPlanAtCoord(coord, planType, typeName));
        document.getElementById('batchModal').classList.remove('show');
        drawGrid();
        showToast('已添加 ' + coords.length + ' 个项目', 'info');
    });
    document.getElementById('batchPreviewCancel').addEventListener('click', () => { document.getElementById('batchPreviewModal').classList.remove('show'); });

    // Clear (admin only)
    document.getElementById('clearBtn').addEventListener('click', () => {
        if (myRole !== 'admin') { showToast('权限不足：仅管理员可清除全部数据', 'error'); return; }
        if (confirm('确定要清除所有内容吗？此操作会影响所有协作者！')) {
            sendMessage({ type: 'clear_all' });
        }
    });

    // Copy export
    document.getElementById('copyBtn').addEventListener('click', async () => {
        await navigator.clipboard.writeText(document.getElementById('exportData').value);
        showToast('已复制到剪贴板！', 'info');
    });
    document.getElementById('exportCancel').addEventListener('click', () => { document.getElementById('exportModal').classList.remove('show'); });

    // Context menu actions
    document.getElementById('ctxEdit').addEventListener('click', () => {
        if (ctxMenuTarget && ctxMenuTarget.type === 'plan') openEditPlanModal(ctxMenuTarget.index);
    });
    document.getElementById('ctxChangeColor').addEventListener('click', () => {
        document.getElementById('contextMenu').classList.remove('show');
        document.getElementById('colorModal').classList.add('show');
    });
    document.getElementById('ctxSwitchRoute').addEventListener('click', () => {
        if (ctxMenuTarget && ctxMenuTarget.type === 'route') {
            const route = routes[ctxMenuTarget.index];
            route.type = route.type === 'curve' ? 'normal' : 'curve';
            sendMessage({ type: 'edit_route', index: ctxMenuTarget.index, route: JSON.parse(JSON.stringify(route)) });
            document.getElementById('contextMenu').classList.remove('show');
            ctxMenuTarget = null;
            drawGrid();
        }
    });
    document.getElementById('ctxCopyCoord').addEventListener('click', () => {
        const coordStr = ctxMenuTarget.type === 'coord' ? '(' + ctxMenuTarget.cell.x + ', ' + ctxMenuTarget.cell.y + ')' : '';
        if (coordStr) navigator.clipboard.writeText(coordStr).then(() => showToast('坐标已复制: ' + coordStr, 'info'));
    });
    document.getElementById('ctxDelete').addEventListener('click', () => {
        if (!requirePermission('delete')) { document.getElementById('contextMenu').classList.remove('show'); return; }
        if (ctxMenuTarget && ctxMenuTarget.type !== 'coord') {
            switch (ctxMenuTarget.type) {
                case 'plan': sendMessage({ type: 'delete_plan', index: ctxMenuTarget.index }); plans.splice(ctxMenuTarget.index, 1); break;
                case 'route': sendMessage({ type: 'delete_route', index: ctxMenuTarget.index }); routes.splice(ctxMenuTarget.index, 1); break;
                case 'text': sendMessage({ type: 'delete_text', index: ctxMenuTarget.index }); texts.splice(ctxMenuTarget.index, 1); break;
                case 'marker': sendMessage({ type: 'delete_marker', index: ctxMenuTarget.index }); markers.splice(ctxMenuTarget.index, 1); break;
            }
        }
        document.getElementById('contextMenu').classList.remove('show');
        ctxMenuTarget = null;
        drawGrid();
    });
    document.getElementById('ctxCancel').addEventListener('click', () => { document.getElementById('contextMenu').classList.remove('show'); });

    // Legend filters
    document.querySelectorAll('.legend-checkbox input[data-filter]').forEach(cb => {
        cb.addEventListener('change', (e) => { filterOptions[e.target.dataset.filter] = e.target.checked; drawGrid(); });
    });
    document.querySelectorAll('.legend-checkbox input[data-color-filter]').forEach(cb => {
        cb.addEventListener('change', (e) => { colorFilters[e.target.dataset.colorFilter] = e.target.checked; drawGrid(); });
    });

    // Type filter
    document.getElementById('showTypeFilter').addEventListener('click', () => { document.getElementById('typeFilterModal').classList.add('show'); });
    document.getElementById('typeFilterCancel').addEventListener('click', () => { document.getElementById('typeFilterModal').classList.remove('show'); });
    document.getElementById('typeFilterSelectAll').addEventListener('click', () => {
        for (const key in planTypeFilters) planTypeFilters[key] = true;
        document.getElementById('typeFilterModal').classList.remove('show');
        drawGrid();
    });
    document.getElementById('typeFilterClearAll').addEventListener('click', () => {
        for (const key in planTypeFilters) planTypeFilters[key] = false;
        document.getElementById('typeFilterModal').classList.remove('show');
        drawGrid();
    });

    // Modal confirms
    document.getElementById('modalConfirm').addEventListener('click', confirmPlan);
    document.getElementById('modalCancel').addEventListener('click', () => {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        pendingPlan = null; editingPlanIndex = -1;
    });
    document.getElementById('textConfirm').addEventListener('click', () => {
        const content = document.getElementById('textContent').value.trim();
        const size = parseInt(document.getElementById('textSize').value);
        if (!content) { showToast('请输入文字内容', 'error'); return; }
        const t = { x: pendingTextPos.x, y: pendingTextPos.y, content, color: currentColor, size };
        texts.push(t);
        document.getElementById('textModal').classList.remove('show');
        pendingTextPos = null;
        sendMessage({ type: 'place_text', text: t });
        drawGrid();
    });
    document.getElementById('textCancel').addEventListener('click', () => {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        pendingTextPos = null;
    });
    document.getElementById('markerCancel').addEventListener('click', () => {
        document.getElementById('markerModal').classList.remove('show');
        pendingMarkerPos = null;
    });

    // Zoom controls
    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(5, zoom * 1.2); drawGrid(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(0.05, zoom / 1.2); drawGrid(); });
    document.getElementById('zoomReset').addEventListener('click', () => { zoom = 1; offsetX = 0; offsetY = 0; drawGrid(); });

    // Canvas mouse events
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const newZoom = Math.max(0.05, Math.min(5, zoom * delta));
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
        const worldX = (mouseX - offsetX) / zoom, worldY = (mouseY - offsetY) / zoom;
        zoom = newZoom;
        offsetX = mouseX - worldX * zoom; offsetY = mouseY - worldY * zoom;
        drawGrid();
        updateCoords(mouseX, mouseY);
    });
    canvas.addEventListener('mousedown', handleMouseDown);
    canvas.addEventListener('mousemove', handleMouseMove);
    canvas.addEventListener('mouseup', handleMouseUp);
    canvas.addEventListener('contextmenu', handleContextMenu);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            if (currentMode === 'warp-circle') { pendingWarpDirection = (pendingWarpDirection || 0) + Math.PI / 12; drawGrid(); }
            else if (ctxMenuTarget && ctxMenuTarget.type === 'plan') {
                const plan = plans[ctxMenuTarget.index];
                if (plan.shape === 'warp') { plan.direction = (plan.direction || 0) + Math.PI / 12; drawGrid(); }
            }
        }
    });
}
    </script>
</body>
</html>
