<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人协作地图编辑器 - 9000×9000</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ─── Login Panel ─── */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: rgba(30, 30, 50, 0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 30px;
            width: 380px;
            max-width: 90vw;
        }
        .login-box h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            border: none;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            transition: all 0.2s;
        }
        .login-box .tab.active {
            background: rgba(0,212,255,0.2);
            color: #fff;
        }
        .login-box .form-group {
            margin-bottom: 14px;
        }
        .login-box .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.7);
        }
        .login-box .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .login-box .form-group input:focus {
            border-color: #00d4ff;
        }
        .login-box .btn-full {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-box .btn-join {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
        }
        .login-box .btn-create {
            background: linear-gradient(135deg, #7b2ff7, #5a1fcc);
            color: #fff;
        }
        .login-box .btn-full:hover { transform: translateY(-1px); }
        .login-box .perms-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 3px 0;
        }
        .login-box .perms-check input { width: 16px; height: 16px; }

        /* ─── Collab Panel ─── */
        .collab-panel {
            position: fixed;
            top: 75px;
            right: 10px;
            background: rgba(30,30,50,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 10px;
            z-index: 1001;
            min-width: 180px;
            font-size: 11px;
        }
        .collab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .collab-room {
            font-weight: bold;
            color: #00d4ff;
            cursor: pointer;
        }
        .collab-toggle {
            background: none; border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer; font-size: 14px;
        }
        .collab-body.collapsed { display: none; }
        .collab-users { margin-bottom: 8px; }
        .collab-user {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
        }
        .collab-user-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #2ecc71; flex-shrink: 0;
        }
        .collab-role-tag {
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: auto;
        }
        .collab-role-tag.admin { background: rgba(255,107,107,0.3); color: #ff6b6b; }
        .collab-role-tag.member { background: rgba(46,204,113,0.3); color: #2ecc71; }
        .collab-role-tag.viewer { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }
        .collab-my-role {
            padding: 4px 8px;
            background: rgba(0,212,255,0.1);
            border-radius: 4px;
            margin-bottom: 6px;
            text-align: center;
            font-size: 10px;
        }
        .collab-btn {
            width: 100%;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            cursor: pointer;
            margin-top: 4px;
        }
        .collab-btn:hover { background: rgba(0,212,255,0.15); }
        .collab-btn.admin-only { border-color: rgba(255,107,107,0.3); }

        /* ─── Admin Panel Modal ─── */
        .admin-member-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .admin-member-row .name { flex: 1; font-size: 12px; }
        .admin-member-row select {
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(30,30,50,0.9);
            color: #fff;
            font-size: 11px;
        }
        .admin-member-row .kick-btn {
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            background: rgba(255,107,107,0.3);
            color: #ff6b6b;
            font-size: 10px;
            cursor: pointer;
        }
        .perm-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .perm-row label { font-size: 12px; color: rgba(255,255,255,0.7); }
        .perm-switch {
            width: 36px; height: 20px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        .perm-switch.on { background: #2ecc71; }
        .perm-switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: left 0.2s;
        }
        .perm-switch.on::after { left: 18px; }

        /* ─── Connection Status ─── */
        .conn-status {
            position: fixed;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 16px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .conn-status.connected { background: rgba(46,204,113,0.2); color: #2ecc71; opacity: 0; }
        .conn-status.reconnecting { background: rgba(255,152,0,0.3); color: #ff9800; opacity: 1; }
        .conn-status.disconnected { background: rgba(255,107,107,0.3); color: #ff6b6b; opacity: 1; }

        /* ─── Notification Toast ─── */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 10000;
            animation: toastIn 0.3s, toastOut 0.3s 2.5s forwards;
        }
        .toast.error { background: rgba(255,107,107,0.9); color: #fff; }
        .toast.info { background: rgba(0,212,255,0.9); color: #000; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>
    <!-- ─── Connection Status ─── -->
    <div class="conn-status reconnecting" id="connStatus">正在连接服务器...</div>

    <!-- ─── Login Overlay ─── -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h1>多人协作地图编辑器</h1>
            <div class="tabs">
                <div class="tab active" id="tabJoin">加入房间</div>
                <div class="tab" id="tabCreate">创建房间</div>
            </div>
            <div id="joinForm">
                <div class="form-group">
                    <label>房间码（6位）</label>
                    <input type="text" id="joinRoomId" placeholder="输入房间码" maxlength="6" style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <label>密码（可选）</label>
                    <input type="password" id="joinPassword" placeholder="房间密码">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="joinUsername" placeholder="你的昵称" maxlength="16">
                </div>
                <button class="btn-full btn-join" id="btnJoin">加入房间</button>
            </div>
            <div id="createForm" style="display:none">
                <div class="form-group">
                    <label>房间名称</label>
                    <input type="text" id="createRoomName" placeholder="给房间起个名字" maxlength="20">
                </div>
                <div class="form-group">
                    <label>房间密码（可选）</label>
                    <input type="password" id="createPassword" placeholder="设置密码保护">
                </div>
                <div class="form-group">
                    <label>Member 权限配置</label>
                    <div class="perms-check">
                        <input type="checkbox" id="permPlace" checked>
                        <span>允许放置物品</span>
                    </div>
                    <div class="perms-check">
                        <input type="checkbox" id="permEdit" checked>
                        <span>允许编辑物品</span>
                    </div>
                    <div class="perms-check">
                        <input type="checkbox" id="permDelete" checked>
                        <span>允许删除物品</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="createUsername" placeholder="你的昵称" maxlength="16">
                </div>
                <button class="btn-full btn-create" id="btnCreate">创建房间</button>
            </div>
        </div>
    </div>

    <!-- ─── Map Editor Toolbar (from original) ─── -->
    <div class="toolbar" id="mainToolbar" style="display:none">
        <h1>多人协作地图编辑器 - 9000×9000</h1>
        
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="space-station">空间站</button>
            <div class="mode-dropdown">
                <button class="mode-btn dropdown-btn" data-mode="building">建筑 ▾</button>
                <div class="dropdown-content" id="buildingDropdown">
                    <button class="mode-btn" data-mode="building-10">10×10 建筑</button>
                    <button class="mode-btn" data-mode="building-20">20×20 建筑</button>
                </div>
            </div>
            <div class="mode-dropdown">
                <button class="mode-btn dropdown-btn" data-mode="plan-circle">计划圈 ▾</button>
                <div class="dropdown-content" id="planCircleDropdown">
                    <button class="mode-btn" data-mode="plan-circle-normal">普通计划圈</button>
                    <button class="mode-btn" data-mode="plan-circle-blockade">封锁计划圈</button>
                    <button class="mode-btn" data-mode="plan-circle-warp1">曲率加速计划1级</button>
                    <button class="mode-btn" data-mode="plan-circle-warp2">曲率加速计划2级</button>
                    <button class="mode-btn" data-mode="plan-circle-auto1">自动采集计划1级</button>
                    <button class="mode-btn" data-mode="plan-circle-auto2">自动采集计划2级</button>
                    <button class="mode-btn" data-mode="plan-circle-defend1">防卫警戒计划1级</button>
                    <button class="mode-btn" data-mode="plan-circle-defend2">防卫警戒计划2级</button>
                    <button class="mode-btn" data-mode="plan-circle-space1">空域改造计划1级</button>
                    <button class="mode-btn" data-mode="plan-circle-space2">空域改造计划2级</button>
                </div>
            </div>
            <button class="mode-btn" data-mode="delegation-circle">委派圈</button>
            <button class="mode-btn" data-mode="warp-circle">曲率圈</button>
            <div class="mode-dropdown">
                <button class="mode-btn dropdown-btn" data-mode="marker">标记 ▾</button>
                <div class="dropdown-content" id="markerDropdown">
                    <button class="mode-btn" data-mode="marker-rally">集合点</button>
                    <button class="mode-btn" data-mode="marker-resource">资源点</button>
                    <button class="mode-btn" data-mode="marker-transit">中转点</button>
                    <button class="mode-btn" data-mode="marker-attack">进攻点</button>
                    <button class="mode-btn" data-mode="marker-caution">注意点</button>
                    <button class="mode-btn" data-mode="marker-defense">防御点</button>
                </div>
            </div>
            <button class="mode-btn" data-mode="route-curve">曲速</button>
            <button class="mode-btn" data-mode="route-normal">普通航线</button>
            <button class="mode-btn" data-mode="text">文字</button>
            <button class="mode-btn" data-mode="move">移动</button>
        </div>
        
        <div class="color-picker">
            <button class="color-btn active" data-color="#ffffff" data-color-id="self" style="background: #ffffff;"><span class="label">自己</span></button>
            <button class="color-btn" data-color="#4a90d9" data-color-id="squad" style="background: #4a90d9;"><span class="label">小队</span></button>
            <button class="color-btn" data-color="#00d4ff" data-color-id="collective" style="background: #00d4ff;"><span class="label">集合体</span></button>
            <button class="color-btn" data-color="#4ecdc4" data-color-id="friendly" style="background: #4ecdc4;"><span class="label">友好</span></button>
            <button class="color-btn" data-color="#ffd93d" data-color-id="enemy1" style="background: #ffd93d;"><span class="label">敌对1</span></button>
            <button class="color-btn" data-color="#aa96da" data-color-id="enemy2" style="background: #aa96da;"><span class="label">敌对2</span></button>
            <button class="color-btn" data-color="#ff6b6b" data-color-id="backup1" style="background: #ff6b6b;"><span class="label">备用1</span></button>
            <button class="color-btn" data-color="#ffe66d" data-color-id="backup2" style="background: #ffe66d;"><span class="label">备用2</span></button>
            <button class="color-btn" data-color="#95e1d3" data-color-id="backup3" style="background: #95e1d3;"><span class="label">备用3</span></button>
        </div>
        
        <div class="coord-input">
            <input type="text" id="coordInput" placeholder="(X,Y) 或 X,Y">
            <button class="btn-secondary" id="jumpBtn">跳转</button>
        </div>
        
        <button class="btn-secondary" id="exportBtn">导出</button>
        <button class="btn-secondary" id="importBtn">导入</button>
        <button class="btn-secondary" id="batchBtn">批量添加</button>
        <button class="btn-secondary admin-only-btn" id="clearBtn">清除</button>
        <button class="btn-primary" id="toggleInfoBtn">显示信息</button>
        
        <span class="info">左键点击放置 | 右键平移/操作 | 移动模式拖拽计划</span>
        
        <!-- Copy Room Code Button -->
        <button class="btn-secondary" id="copyRoomBtn" style="background:rgba(0,212,255,0.15);border-color:rgba(0,212,255,0.3);color:#00d4ff;">复制房间码</button>
        <button class="btn-secondary admin-only-btn" id="adminPanelBtn" style="background:rgba(123,47,247,0.15);border-color:rgba(123,47,247,0.3);color:#9b7bff;">管理</button>
    </div>

    <div class="canvas-container" id="canvasContainer" style="display:none">
        <canvas id="gameCanvas"></canvas>
        <div class="selection-overlay" id="selectionOverlay"></div>
    </div>

    <div class="zoom-controls" id="zoomControls" style="display:none">
        <button class="zoom-btn" id="zoomIn">+</button>
        <button class="zoom-btn" id="zoomOut">−</button>
        <button class="zoom-btn" id="zoomReset">1:1</button>
    </div>

    <div class="coords" id="coords" style="display:none">位置: (0, 0) | 缩放: 100%</div>
    
    <!-- ─── Collab Panel ─── -->
    <div class="collab-panel" id="collabPanel" style="display:none">
        <div class="collab-header">
            <span class="collab-room" id="collabRoomCode" title="点击复制房间码">房间: ---</span>
            <button class="collab-toggle" id="collabToggle">_</button>
        </div>
        <div class="collab-body" id="collabBody">
            <div class="collab-my-role" id="collabMyRole">角色: --</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.5);margin-bottom:4px;">在线用户:</div>
            <div class="collab-users" id="collabUsers"></div>
        </div>
    </div>
    
    <!-- ─── Legend (from original) ─── -->
    <div class="legend" id="legendPanel" style="display:none">
        <div class="legend-header">筛选</div>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="space-station"> <span>空间站</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="building"> <span>建筑计划</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="plan-circle"> <span>计划圈</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="delegation-circle"> <span>委派圈</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="warp-circle"> <span>曲率圈</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="warp-route"> <span>曲速航线</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="normal-route"> <span>普通航线</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="marker"> <span>标记</span></label>
        <label class="legend-checkbox"><input type="checkbox" checked data-filter="text"> <span>文字</span></label>
        <div class="legend-divider"></div>
        <div class="legend-header">按颜色筛选</div>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="self"> <span class="color-dot" style="background: #ffffff;"></span>自己</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="squad"> <span class="color-dot" style="background: #4a90d9;"></span>小队</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="collective"> <span class="color-dot" style="background: #00d4ff;"></span>集合体</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="friendly"> <span class="color-dot" style="background: #4ecdc4;"></span>友好</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="enemy1"> <span class="color-dot" style="background: #ffd93d;"></span>敌对1</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="enemy2"> <span class="color-dot" style="background: #aa96da;"></span>敌对2</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="backup1"> <span class="color-dot" style="background: #ff6b6b;"></span>备用1</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="backup2"> <span class="color-dot" style="background: #ffe66d;"></span>备用2</label>
        <label class="legend-checkbox color-filter"><input type="checkbox" checked data-color-filter="backup3"> <span class="color-dot" style="background: #95e1d3;"></span>备用3</label>
        <div class="legend-divider"></div>
        <button class="legend-btn" id="showTypeFilter">计划类型</button>
    </div>

    <!-- ─── Original Modals ─── -->
    <div class="modal" id="typeFilterModal">
        <div class="modal-content" style="width: 450px; max-height: 70vh; overflow-y: auto;">
            <h2>筛选计划类型</h2>
            <div class="type-filter-grid" id="typeFilterGrid"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="typeFilterCancel">关闭</button>
                <button class="btn-secondary" id="typeFilterSelectAll">全选</button>
                <button class="btn-secondary" id="typeFilterClearAll">清空</button>
            </div>
        </div>
    </div>

    <div class="modal" id="batchModal">
        <div class="modal-content" style="width: 500px;">
            <h2>批量添加计划</h2>
            <div class="batch-info">
                <p>输入坐标列表，每行一个，格式：X,Y</p>
                <pre>100,200
300,400
500,600</pre>
            </div>
            <div class="form-group"><label>坐标列表</label><textarea id="batchCoords" style="height:150px;"></textarea></div>
            <div class="form-group"><label>计划类型</label><select id="batchPlanType"><option value="plan-circle">计划圈（10直径）</option><option value="delegation-circle">委派圈（30直径）</option><option value="warp-circle">曲率圈（20×20）</option><option value="marker">标记</option></select></div>
            <div class="form-group"><label>标记/类型（选填）</label><input type="text" id="batchTypeName"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="batchCancel">取消</button>
                <button class="btn-primary" id="batchPreview">预览</button>
                <button class="btn-primary" id="batchConfirm">添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="batchPreviewModal">
        <div class="modal-content" style="width:600px;max-height:80vh;overflow-y:auto;">
            <h2>预览批量添加</h2>
            <p id="batchPreviewInfo"></p>
            <div id="batchPreviewList"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="batchPreviewCancel">取消</button>
                <button class="btn-primary" id="batchPreviewConfirm">确认添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="planModal">
        <div class="modal-content">
            <h2 id="planModalTitle">计划信息</h2>
            <input type="hidden" id="editPlanIndex"><input type="hidden" id="planMode">
            <div class="form-group"><label>计划名称</label><input type="text" id="planName"></div>

// ═══════════════════════════════════════════════════════════
// Toast notifications
// ═══════════════════════════════════════════════════════════
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ═══════════════════════════════════════════════════════════
// Connection Status
// ═══════════════════════════════════════════════════════════
function setConnStatus(status) {
    const el = document.getElementById('connStatus');
    el.className = 'conn-status ' + status;
    if (status === 'connected') {
        el.textContent = '已连接';
        setTimeout(() => { el.className = 'conn-status connected'; }, 2000);
    } else if (status === 'reconnecting') {
        el.textContent = '正在重新连接...';
    } else {
        el.textContent = '连接断开';
    }
}

// ═══════════════════════════════════════════════════════════
// WebSocket
// ═══════════════════════════════════════════════════════════
function connectWebSocket(roomId, password, username) {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + location.host;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        setConnStatus('connected');
        reconnectAttempts = 0;

        // Send join message
        ws.send(JSON.stringify({
            type: 'join',
            roomId: roomId,
            password: password || '',
            username: username
        }));
    };

    ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            handleServerMessage(msg);
        } catch (e) {
            console.error('Invalid server message:', e);
        }
    };

    ws.onclose = () => {
        setConnStatus('disconnected');
        attemptReconnect(roomId, password, username);
    };

    ws.onerror = () => {
        // onclose will fire after this
    };
}

function attemptReconnect(roomId, password, username) {
    if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
        showToast('无法重新连接，请刷新页面', 'error');
        return;
    }
    reconnectAttempts++;
    setConnStatus('reconnecting');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(() => {
        connectWebSocket(roomId, password, username);
    }, RECONNECT_DELAY * Math.min(reconnectAttempts, 5));
}

function handleServerMessage(msg) {
    switch (msg.type) {
        case 'joined':
            myUserId = msg.userId;
            myUsername = msg.username;
            myRole = msg.role;
            permissions = msg.permissions || permissions;
            roomUsers = msg.users || [];

            // Load room data
            if (msg.room) {
                plans = msg.room.plans || [];
                routes = msg.room.routes || [];
                markers = msg.room.markers || [];
                texts = msg.room.texts || [];
            }

            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainToolbar').style.display = 'flex';
            document.getElementById('canvasContainer').style.display = 'block';
            document.getElementById('zoomControls').style.display = 'flex';
            document.getElementById('coords').style.display = 'block';
            document.getElementById('legendPanel').style.display = 'block';
            document.getElementById('collabPanel').style.display = 'block';

            document.getElementById('collabRoomCode').textContent = '房间: ' + myRoomId;
            updateCollabUI();
            updateAdminButtons();
            initCanvas();
            break;

        case 'error':
            showToast(msg.message, 'error');
            // If error during join, show login again
            if (!myUserId) {
                ws.close();
            }
            break;

        case 'user_joined':
            roomUsers.push({ userId: msg.userId, username: msg.username, role: msg.role });
            updateCollabUI();
            break;

        case 'user_left':
            roomUsers = roomUsers.filter(u => u.userId !== msg.userId);
            updateCollabUI();
            break;

        case 'user_list':
            roomUsers = msg.users || [];
            updateCollabUI();
            break;

        case 'plan_placed':
            plans.push(msg.plan);
            drawGrid();
            break;

        case 'plan_edited':
            if (msg.index >= 0 && msg.index < plans.length) {
                plans[msg.index] = msg.plan;
                drawGrid();
            }
            break;

        case 'plan_deleted':
            if (msg.index >= 0 && msg.index < plans.length) {
                plans.splice(msg.index, 1);
                drawGrid();
            }
            break;

        case 'plan_moved':
            if (msg.index >= 0 && msg.index < plans.length) {
                plans[msg.index].x = msg.x;
                plans[msg.index].y = msg.y;
                drawGrid();
            }
            break;

        case 'route_placed':
            routes.push(msg.route);
            drawGrid();
            break;

        case 'route_edited':
            if (msg.index >= 0 && msg.index < routes.length) {
                routes[msg.index] = msg.route;
                drawGrid();
            }
            break;

        case 'route_deleted':
            if (msg.index >= 0 && msg.index < routes.length) {
                routes.splice(msg.index, 1);
                drawGrid();
            }
            break;

        case 'marker_placed':
            markers.push(msg.marker);
            drawGrid();
            break;

        case 'marker_edited':
            if (msg.index >= 0 && msg.index < markers.length) {
                markers[msg.index] = msg.marker;
                drawGrid();
            }
            break;

        case 'marker_deleted':
            if (msg.index >= 0 && msg.index < markers.length) {
                markers.splice(msg.index, 1);
                drawGrid();
            }
            break;

        case 'marker_moved':
            if (msg.index >= 0 && msg.index < markers.length) {
                markers[msg.index].x = msg.x;
                markers[msg.index].y = msg.y;
                drawGrid();
            }
            break;

        case 'text_placed':
            texts.push(msg.text);
            drawGrid();
            break;

        case 'text_edited':
            if (msg.index >= 0 && msg.index < texts.length) {
                texts[msg.index] = msg.text;
                drawGrid();
            }
            break;

        case 'text_deleted':
            if (msg.index >= 0 && msg.index < texts.length) {
                texts.splice(msg.index, 1);
                drawGrid();
            }
            break;

        case 'text_moved':
            if (msg.index >= 0 && msg.index < texts.length) {
                texts[msg.index].x = msg.x;
                texts[msg.index].y = msg.y;
                drawGrid();
            }
            break;

        case 'clear_all':
            plans = []; routes = []; markers = []; texts = [];
            routeStart = null;
            drawGrid();
            break;

        case 'import_data':
            if (msg.plans) plans = msg.plans;
            if (msg.routes) routes = msg.routes;
            if (msg.markers) markers = msg.markers;
            if (msg.texts) texts = msg.texts;
            drawGrid();
            break;

        case 'role_changed':
            const targetUser = roomUsers.find(u => u.userId === msg.targetUserId);
            if (targetUser) targetUser.role = msg.role;
            // Update our own role if it changed
            if (msg.targetUserId === myUserId) {
                myRole = msg.role;
                updateCollabUI();
                updateAdminButtons();
            }
            updateCollabUI();
            break;

        case 'permission_changed':
            permissions[msg.key] = msg.value;
            updateAdminPermsUI();
            break;
    }
}

function sendMessage(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
    } else {
        showToast('未连接到服务器', 'error');
    }
}

// ═══════════════════════════════════════════════════════════
// Permission Helpers
// ═══════════════════════════════════════════════════════════
function checkPermission(action) {
    if (myRole === 'viewer') return false;
    if (myRole === 'admin') return true;
    switch (action) {
        case 'place': return permissions.memberCanPlace !== false;
        case 'edit': return permissions.memberCanEdit !== false;
        case 'delete': return permissions.memberCanDelete !== false;
        default: return false;
    }
}

function requirePermission(action) {
    if (!checkPermission(action)) {
        showToast('权限不足：你当前是 ' + myRole + ' 角色', 'error');
        return false;
    }
    return true;
}

        '</div>'

}

function roleLabel(role) {
    return role === 'admin' ? '管理员' : role === 'member' ? '成员' : '观察者';
}

function roleColor(role) {
    return role === 'admin' ? '#ff6b6b' : role === 'member' ? '#2ecc71' : 'rgba(255,255,255,0.5)';
}

function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function updateAdminButtons() {
    const isAdmin = myRole === 'admin';
    document.querySelectorAll('.admin-only-btn').forEach(btn => {
        btn.style.display = isAdmin ? '' : 'none';

}

            '<select onchange="changeUserRole(\'' + u.userId + '\', this.value)" ' + (myRole !== 'admin' ? 'disabled' : '') + '>' +
            '<option value="member"' + (u.role === 'member' ? ' selected' : '') + '>成员</option>' +
            '<option value="viewer"' + (u.role === 'viewer' ? ' selected' : '') + '>观察者</option>' +
            '</select>') +
            '</div>';
    }).join('');
}

function updateAdminPermsUI() {
    document.getElementById('adminPerms').innerHTML = [
        { key: 'memberCanPlace', label: '允许Member放置物品' },
        { key: 'memberCanEdit', label: '允许Member编辑物品' },
        { key: 'memberCanDelete', label: '允许Member删除物品' }
    ].map(p => 
        '<div class="perm-row">' +
        '<label>' + p.label + '</label>' +
        '<div class="perm-switch' + (permissions[p.key] ? ' on' : '') + '" onclick="togglePermission(\'' + p.key + '\')"></div>' +
        '</div>'
    ).join('');
}

function changeUserRole(userId, role) {
    sendMessage({ type: 'set_role', targetUserId: userId, role });
    showToast('角色已更新', 'info');
}

function togglePermission(key) {
    const newVal = !permissions[key];
    sendMessage({ type: 'set_permission', key, value: newVal });

// ═══════════════════════════════════════════════════════════
// Map Editor Functions (mostly from original, modified for collab)
// ═══════════════════════════════════════════════════════════

function snapToGrid10x10(cell) {
    return { x: Math.floor(cell.x / 10) * 10, y: Math.floor(cell.y / 10) * 10 };
}

function parseCoords(input) {
    const match = input.match(/\(?\s*(\d+)\s*[,\s]\s*(\d+)\s*\)?/);
    return match ? { x: parseInt(match[1]), y: parseInt(match[2]) } : null;
}

function pointToLineDistance(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = lenSq !== 0 ? dot / lenSq : -1;
    let xx, yy;
    if (param < 0) { xx = x1; yy = y1; }
    else if (param > 1) { xx = x2; yy = y2; }
    else { xx = x1 + param * C; yy = y1 + param * D; }
    return Math.sqrt(Math.pow(px - xx, 2) + Math.pow(py - yy, 2));
}

function getCellFromPosition(screenX, screenY, cellSizeScaled) {
    return {
        x: Math.max(0, Math.min(GRID_SIZE - 1, Math.floor((screenX - offsetX) / cellSizeScaled))),
        y: Math.max(0, Math.min(GRID_SIZE - 1, Math.floor((screenY - offsetY) / cellSizeScaled)))
    };
}

function checkOverlap(newPlan, excludeIndex = -1) {
    return plans.some((plan, index) => {
        if (index === excludeIndex) return false;
        if (newPlan.canOverlap) return false;
        if (plan.shape === 'square' && newPlan.shape === 'square') {
            const newIsStation = newPlan.width >= 40;
            const planIsStation = plan.width >= 40;
            if (newIsStation && planIsStation) {
                return !(newPlan.x + newPlan.width <= plan.x ||
                         newPlan.x >= plan.x + plan.width ||
                         newPlan.y + newPlan.height <= plan.y ||
                         newPlan.y >= plan.y + plan.height);
            }
            if (newIsStation || planIsStation) return false;
            return !(newPlan.x + newPlan.width <= plan.x ||
                     newPlan.x >= plan.x + plan.width ||
                     newPlan.y + newPlan.height <= plan.y ||
                     newPlan.y >= plan.y + plan.height);
        }
        return false;
    });
}

// ─── Drawing ───
let drawFrame = null;

function drawGrid() {
    if (drawFrame) cancelAnimationFrame(drawFrame);
    drawFrame = requestAnimationFrame(() => {
        if (!canvas) return;
        const width = canvas.width || window.innerWidth;
        const height = canvas.height || (window.innerHeight - 70);
        canvas.width = width;
        canvas.height = height;

        const cellSizeScaled = CELL_SIZE * zoom;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, width, height);

        const startX = Math.floor(-offsetX / cellSizeScaled);
        const startY = Math.floor(-offsetY / cellSizeScaled);
        const endX = Math.ceil((-offsetX + width) / cellSizeScaled);
        const endY = Math.ceil((-offsetY + height) / cellSizeScaled);
        const visibleStartX = Math.max(0, startX - 1);
        const visibleStartY = Math.max(0, startY - 1);
        const visibleEndX = Math.min(GRID_SIZE, endX + 1);
        const visibleEndY = Math.min(GRID_SIZE, endY + 1);

        ctx.strokeStyle = '#2a2a4a';
        ctx.lineWidth = 0.5;
        if (cellSizeScaled > 1) {
            for (let x = visibleStartX; x <= visibleEndX; x += Math.max(1, Math.floor(1 / zoom))) {
                const screenX = x * cellSizeScaled + offsetX;
                ctx.beginPath(); ctx.moveTo(screenX, 0); ctx.lineTo(screenX, height); ctx.stroke();
            }
            for (let y = visibleStartY; y <= visibleEndY; y += Math.max(1, Math.floor(1 / zoom))) {
                const screenY = y * cellSizeScaled + offsetY;
                ctx.beginPath(); ctx.moveTo(0, screenY); ctx.lineTo(width, screenY); ctx.stroke();
            }
        }
        if (cellSizeScaled > 5) drawGridLines10x10(cellSizeScaled, visibleStartX, visibleStartY, visibleEndX, visibleEndY);

        drawPlans(cellSizeScaled);
        drawRoutes(cellSizeScaled);
        drawMarkers(cellSizeScaled);
        drawTexts(cellSizeScaled);
        drawPreview(cellSizeScaled);
    });
}

function drawPreview(cellSizeScaled) {
    if (mousePreviewCell && currentMode !== 'move') {
        const cell = mousePreviewCell;
        const screenX = cell.x * cellSizeScaled + offsetX;
        const screenY = cell.y * cellSizeScaled + offsetY;

        ctx.strokeStyle = currentColor;
        ctx.fillStyle = currentColor + '40';
        ctx.lineWidth = Math.max(2, 2 * zoom);
        ctx.setLineDash([5, 5]);

        if (currentMode === 'space-station' || pendingSpaceStationSize) {
            const w = (pendingSpaceStationSize ? pendingSpaceStationSize.width : 40) * cellSizeScaled;
            const h = (pendingSpaceStationSize ? pendingSpaceStationSize.height : 40) * cellSizeScaled;
            ctx.fillRect(screenX, screenY, w, h);
            ctx.strokeRect(screenX, screenY, w, h);
        } else if (currentMode === 'building-20') {
            const size = 20 * cellSizeScaled;
            ctx.fillRect(screenX, screenY, size, size);
            ctx.strokeRect(screenX, screenY, size, size);
        } else if (currentMode === 'building-10' || currentMode === 'building') {
            const size = 10 * cellSizeScaled;
            ctx.fillRect(screenX, screenY, size, size);
            ctx.strokeRect(screenX, screenY, size, size);
        } else if (currentMode === 'plan-circle') {
            const radius = 5 * cellSizeScaled;
            ctx.beginPath(); ctx.arc(screenX, screenY, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (currentMode === 'delegation-circle') {
            const radius = 15 * cellSizeScaled;
            ctx.beginPath(); ctx.arc(screenX, screenY, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (currentMode === 'warp-circle') {
            const squareSize = 20 * cellSizeScaled, triangleHeight = 10 * cellSizeScaled;
            const direction = pendingWarpDirection || 0;
            ctx.save();
            ctx.translate(screenX + squareSize / 2, screenY + squareSize / 2);
            ctx.rotate(direction);
            ctx.translate(-squareSize / 2, -squareSize / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(squareSize, 0);
            ctx.lineTo(squareSize + triangleHeight, squareSize / 2);
            ctx.lineTo(squareSize, squareSize); ctx.lineTo(0, squareSize);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        } else if (currentMode === 'marker' || currentMode.startsWith('marker-')) {
            const size = 10 * cellSizeScaled;
            ctx.save();
            ctx.globalAlpha = 0.33;
            ctx.fillStyle = currentColor; ctx.strokeStyle = currentColor;
            drawMarkerIcon(selectedMarkerType, screenX + size/2, screenY + size/2, size/2);
            ctx.restore();
        }
        ctx.setLineDash([]);
    }

    if (routeStart) {
        const screenX = routeStart.x * cellSizeScaled + offsetX + cellSizeScaled / 2;
        const screenY = routeStart.y * cellSizeScaled + offsetY + cellSizeScaled / 2;
        ctx.fillStyle = currentColor;
        ctx.beginPath(); ctx.arc(screenX, screenY, Math.max(4, 4 * zoom), 0, Math.PI * 2); ctx.fill();
        ctx.font = Math.max(10, 12 * zoom) + 'px sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('起点', screenX + 8, screenY - 6);
    }
}

function drawGridLines10x10(cellSizeScaled, startX, startY, endX, endY) {
    if (cellSizeScaled < 0.5) return;
    ctx.strokeStyle = '#3a3a5a';
    ctx.lineWidth = Math.max(0.5, 1);
    const gridSize = 10;

    if (cellSizeScaled < 2) {
        const bigGridSize = 100;
        const startBigX = Math.floor(startX / bigGridSize) * bigGridSize;
        const startBigY = Math.floor(startY / bigGridSize) * bigGridSize;
        const endBigX = Math.ceil(endX / bigGridSize) * bigGridSize;
        const endBigY = Math.ceil(endY / bigGridSize) * bigGridSize;
        ctx.strokeStyle = '#4a4a6a'; ctx.lineWidth = 1;
        for (let x = startBigX; x <= endBigX; x += bigGridSize) {
            const screenX = x * cellSizeScaled + offsetX;
            ctx.beginPath(); ctx.moveTo(screenX, 0); ctx.lineTo(screenX, canvas.height); ctx.stroke();
        }
        for (let y = startBigY; y <= endBigY; y += bigGridSize) {
            const screenY = y * cellSizeScaled + offsetY;
            ctx.beginPath(); ctx.moveTo(0, screenY); ctx.lineTo(canvas.width, screenY); ctx.stroke();
        }
        return;
    }

    const startGridX = Math.floor(startX / gridSize) * gridSize;
    const startGridY = Math.floor(startY / gridSize) * gridSize;
    const endGridX = Math.ceil(endX / gridSize) * gridSize;
    const endGridY = Math.ceil(endY / gridSize) * gridSize;
    for (let x = startGridX; x <= endGridX; x += gridSize) {
        const screenX = x * cellSizeScaled + offsetX;
        ctx.beginPath(); ctx.moveTo(screenX, 0); ctx.lineTo(screenX, canvas.height); ctx.stroke();
    }
    for (let y = startGridY; y <= endGridY; y += gridSize) {
        const screenY = y * cellSizeScaled + offsetY;
        ctx.beginPath(); ctx.moveTo(0, screenY); ctx.lineTo(canvas.width, screenY); ctx.stroke();
    }
}

function drawPlans(cellSizeScaled) {
    const lowZoom = zoom < 0.3;

    plans.forEach(plan => {
        let planType = '';
        if (plan.shape === 'square' && plan.width >= 40) planType = 'space-station';
        else if (plan.shape === 'square') planType = 'building';
        else if (plan.shape === 'delegation') planType = 'delegation-circle';
        else if (plan.shape === 'warp') planType = 'warp-circle';
        else if (plan.shape === 'circle') planType = 'plan-circle';

        if (!filterOptions[planType]) return;
        if (!planTypeFilters[plan.type]) return;
        const colorId = COLOR_IDS[plan.color];
        if (colorId && !colorFilters[colorId]) return;

        const screenX = plan.x * cellSizeScaled + offsetX;
        const screenY = plan.y * cellSizeScaled + offsetY;
        ctx.fillStyle = plan.color + '30';

        if (plan.shape === 'square') {
            const w = plan.width * cellSizeScaled, h = plan.height * cellSizeScaled;
            ctx.fillRect(screenX, screenY, w, h);
            if (!lowZoom) {
                ctx.strokeStyle = plan.color;
                ctx.lineWidth = Math.max(1, 2 * zoom);
                ctx.strokeRect(screenX, screenY, w, h);
            }
        } else if (plan.shape === 'delegation') {
            const radius = (plan.radius || 15) * cellSizeScaled;
            const centerX = screenX + radius, centerY = screenY + radius;
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.fill();
            if (!lowZoom) {
                ctx.strokeStyle = plan.color;
                ctx.lineWidth = Math.max(1, 2 * zoom);
                ctx.stroke();
            }
        } else if (plan.shape === 'warp') {
            const squareSize = 20 * cellSizeScaled, triangleHeight = 10 * cellSizeScaled;
            const direction = plan.direction || 0;
            ctx.save();
            ctx.translate(screenX + squareSize / 2, screenY + squareSize / 2);
            ctx.rotate(direction);
            ctx.translate(-squareSize / 2, -squareSize / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(squareSize, 0);
            ctx.lineTo(squareSize + triangleHeight, squareSize / 2);
            ctx.lineTo(squareSize, squareSize); ctx.lineTo(0, squareSize);
            ctx.closePath(); ctx.fill();
            if (!lowZoom) { ctx.strokeStyle = plan.color; ctx.lineWidth = Math.max(1, 2 * zoom); ctx.stroke(); }
            ctx.restore();
        } else {
            const radius = (plan.radius || 5) * cellSizeScaled;
            const centerX = screenX + radius, centerY = screenY + radius;
            if (plan.type === '封锁计划圈') {
                ctx.fillStyle = plan.color + '40';
                ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.fill();
                if (!lowZoom) {
                    ctx.save();
                    ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.clip();
                    ctx.strokeStyle = plan.color + '80';
                    ctx.lineWidth = Math.max(1, 1 * zoom);
                    const stripeWidth = Math.max(3, 3 * zoom);
                    for (let i = -radius * 2; i < radius * 2; i += stripeWidth * 2) {
                        ctx.beginPath();
                        ctx.moveTo(screenX + i, screenY);
                        ctx.lineTo(screenX + i + radius * 2, screenY + radius * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                    ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = plan.color; ctx.lineWidth = Math.max(1, 2 * zoom); ctx.stroke();
                }
            } else {
                ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.fill();
                if (!lowZoom) { ctx.strokeStyle = plan.color; ctx.lineWidth = Math.max(1, 2 * zoom); ctx.stroke(); }
            }
        }

        if (showPlanInfo && plan.name && zoom > 0.3) {
            ctx.fillStyle = plan.color;
            ctx.font = Math.max(10, 12 * zoom) + 'px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            if (plan.shape === 'square') {
                const txtX = screenX + (plan.width * cellSizeScaled) / 2;
                const txtY = screenY + (plan.height * cellSizeScaled) / 2;
                ctx.fillText(plan.name, txtX, txtY);
                if ((plan.type || plan.docking || plan.note) && zoom > 0.5) {
                    ctx.font = Math.max(8, 10 * zoom) + 'px sans-serif';
                    let line = 1;
                    if (plan.type) ctx.fillText('类型: ' + plan.type, txtX, txtY + (14 * zoom) * line++);
                    if (plan.docking) ctx.fillText('对接: ' + plan.docking, txtX, txtY + (14 * zoom) * line++);
                    if (plan.note) {
                        const noteText = plan.note.length > 20 ? plan.note.substring(0, 20) + '...' : plan.note;
                        ctx.fillText('备注: ' + noteText, txtX, txtY + (14 * zoom) * line);
                    }
                }
            } else {
                const radius = (plan.radius || 5) * cellSizeScaled;
                ctx.fillText(plan.name, screenX + radius, screenY + radius);
                if (plan.type && zoom > 0.5) {
                    ctx.font = Math.max(8, 10 * zoom) + 'px sans-serif';
                    ctx.fillText('类型: ' + plan.type, screenX + radius, screenY + radius + (12 * zoom));
                }
            }
        }
    });
}

function drawRoutes(cellSizeScaled) {
    const lowZoom = zoom < 0.3;
    routes.forEach(route => {
        if (route.type === 'curve' && !filterOptions['warp-route']) return;
        if (route.type === 'normal' && !filterOptions['normal-route']) return;
        const colorId = COLOR_IDS[route.color];
        if (colorId && !colorFilters[colorId]) return;

        const startScreenX = route.start.x * cellSizeScaled + offsetX + cellSizeScaled / 2;
        const startScreenY = route.start.y * cellSizeScaled + offsetY + cellSizeScaled / 2;
        const endScreenX = route.end.x * cellSizeScaled + offsetX + cellSizeScaled / 2;
        const endScreenY = route.end.y * cellSizeScaled + offsetY + cellSizeScaled / 2;

        ctx.strokeStyle = route.color;
        ctx.lineWidth = Math.max(1, lowZoom ? 1 : 2 * zoom);
        let arrowAngle = Math.atan2(endScreenY - startScreenY, endScreenX - startScreenX);

        if (route.type === 'curve') {
            ctx.beginPath();
            const midX = (startScreenX + endScreenX) / 2, midY = (startScreenY + endScreenY) / 2;
            const dist = Math.sqrt(Math.pow(endScreenX - startScreenX, 2) + Math.pow(endScreenY - startScreenY, 2));
            const ctrlOffset = dist * 0.4;
            const dx = endScreenX - startScreenX, dy = endScreenY - startScreenY;
            const perpX = -dy / dist * ctrlOffset, perpY = dx / dist * ctrlOffset;
            const ctrlX = midX + perpX, ctrlY = midY + perpY;
            ctx.moveTo(startScreenX, startScreenY);
            ctx.quadraticCurveTo(ctrlX, ctrlY, endScreenX, endScreenY);
            ctx.stroke();
            if (!lowZoom) arrowAngle = Math.atan2(endScreenY - ctrlY, endScreenX - ctrlX);
        } else {
            ctx.setLineDash([6 * zoom, 4 * zoom]);
            ctx.beginPath(); ctx.moveTo(startScreenX, startScreenY); ctx.lineTo(endScreenX, endScreenY);
            ctx.stroke(); ctx.setLineDash([]);
        }

        if (!lowZoom) {
            ctx.fillStyle = route.color;
            ctx.beginPath(); ctx.arc(startScreenX, startScreenY, Math.max(3, 3 * zoom), 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            const arrowSize = Math.max(6, 6 * zoom);
            ctx.moveTo(endScreenX - arrowSize * Math.cos(arrowAngle - Math.PI / 6), endScreenY - arrowSize * Math.sin(arrowAngle - Math.PI / 6));
            ctx.lineTo(endScreenX, endScreenY);
            ctx.lineTo(endScreenX - arrowSize * Math.cos(arrowAngle + Math.PI / 6), endScreenY - arrowSize * Math.sin(arrowAngle + Math.PI / 6));
            ctx.stroke();
        }
    });
}

function drawMarkers(cellSizeScaled) {
    if (!filterOptions['marker']) return;
    const markerSize = 10 * cellSizeScaled;
    markers.forEach(marker => {
        const colorId = COLOR_IDS[marker.color];
        if (colorId && !colorFilters[colorId]) return;
        const screenX = marker.x * cellSizeScaled + offsetX;
        const screenY = marker.y * cellSizeScaled + offsetY;
        ctx.save();
        ctx.globalAlpha = 0.33;
        ctx.fillStyle = marker.color; ctx.strokeStyle = marker.color; ctx.lineWidth = 1.5;
        drawMarkerIcon(marker.type, screenX + markerSize/2, screenY + markerSize/2, markerSize/2);
        ctx.restore();
    });
}

function drawMarkerIcon(type, cx, cy, size) {
    const emoji = MARKER_TYPES[type]?.emoji || '📍';
    ctx.font = (size * 2.5) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, cx, cy);
}

function drawTexts(cellSizeScaled) {
    if (!filterOptions['text']) return;
    texts.forEach(text => {
        if (zoom < 0.3) return;
        const screenX = text.x * cellSizeScaled + offsetX;
        const screenY = text.y * cellSizeScaled + offsetY;
        ctx.fillStyle = text.color;
        ctx.font = (text.size * zoom) + 'px sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(text.content, screenX, screenY);
    });
}

// ─── Marker Grid Init ───
function initMarkerGrid() {
    const grid = document.getElementById('markerGrid');
    grid.innerHTML = '';
    Object.entries(MARKER_TYPES).forEach(([key, marker]) => {
        const item = document.createElement('div');
        item.className = 'marker-item';
        item.innerHTML = '<span class="marker-emoji">' + marker.emoji + '</span><span>' + marker.name + '</span>';
        item.addEventListener('click', () => {
            const newMarker = { x: pendingMarkerPos.x, y: pendingMarkerPos.y, type: key, color: currentColor, name: '' };
            markers.push(newMarker);
            document.getElementById('markerModal').classList.remove('show');
            pendingMarkerPos = null;
            sendMessage({ type: 'place_marker', marker: newMarker });
            drawGrid();
        });
        grid.appendChild(item);
    });
}

// ─── Type Filter Grid Init ───
function initTypeFilterGrid() {
    const grid = document.getElementById('typeFilterGrid');
    const types = Object.keys(planTypeFilters);
    grid.innerHTML = types.map(t =>
        '<label class="legend-checkbox"><input type="checkbox" checked data-type-filter="' + escHtml(t) + '"> <span>' + escHtml(t) + '</span></label>'
    ).join('');

    grid.querySelectorAll('input').forEach(cb => {
        cb.addEventListener('change', () => {
            planTypeFilters[cb.dataset.typeFilter] = cb.checked;
            drawGrid();
        });
    });
}

// ─── Item Finding ───
function findItemAt(x, y) {
    for (let i = plans.length - 1; i >= 0; i--) {
        const plan = plans[i];
        if (plan.shape === 'square') {
            if (x >= plan.x && x < plan.x + plan.width && y >= plan.y && y < plan.y + plan.height) return { type: 'plan', index: i };
        } else {
            const cx = plan.x + (plan.radius || 5), cy = plan.y + (plan.radius || 5);
            if (Math.sqrt((x - cx) ** 2 + (y - cy) ** 2) <= (plan.radius || 5)) return { type: 'plan', index: i };
        }
    }
    for (let i = routes.length - 1; i >= 0; i--) {
        const r = routes[i];
        if (pointToLineDistance(x, y, r.start.x, r.start.y, r.end.x, r.end.y) <= 3) return { type: 'route', index: i };
    }
    for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        if (x >= t.x && x < t.x + 100 && y >= t.y && y < t.y + t.size) return { type: 'text', index: i };
    }
    for (let i = markers.length - 1; i >= 0; i--) {
        const m = markers[i];
        if (x >= m.x && x < m.x + 3 && y >= m.y && y < m.y + 3) return { type: 'marker', index: i };
    }
    return { type: 'coord', cell: { x, y } };
}

function findMovableItemAt(x, y) {
    for (let i = plans.length - 1; i >= 0; i--) {
        const plan = plans[i];
        if (plan.shape === 'square') {
            if (x >= plan.x && x < plan.x + plan.width && y >= plan.y && y < plan.y + plan.height) return { type: 'plan', index: i };
        } else {
            const cx = plan.x + (plan.radius || 5), cy = plan.y + (plan.radius || 5);
            if (Math.sqrt((x - cx) ** 2 + (y - cy) ** 2) <= (plan.radius || 5) + 2) return { type: 'plan', index: i };
        }
    }
    for (let i = routes.length - 1; i >= 0; i--) {
        if (pointToLineDistance(x, y, routes[i].start.x, routes[i].start.y, routes[i].end.x, routes[i].end.y) <= 3) return { type: 'route', index: i };
    }
    for (let i = markers.length - 1; i >= 0; i--) {
        if (Math.abs(x - markers[i].x) <= 5 && Math.abs(y - markers[i].y) <= 5) return { type: 'marker', index: i };
    }
    for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        if (x >= t.x && x < t.x + 20 && y >= t.y && y < t.y + 10) return { type: 'text', index: i };
    }
    return null;
}

// ─── Selection Overlay ───
function updateSelection() {
    if (!selectionStart || !selectionEnd) { selectionOverlay.style.display = 'none'; return; }
    const cellSizeScaled = CELL_SIZE * zoom;
    let overlayWidth, overlayHeight;
    if (currentMode === 'building-20') { overlayWidth = 20 * cellSizeScaled; overlayHeight = 20 * cellSizeScaled; }
    else if (currentMode === 'building-10' || currentMode === 'building') { overlayWidth = 10 * cellSizeScaled; overlayHeight = 10 * cellSizeScaled; }
    else { overlayWidth = 10 * cellSizeScaled; overlayHeight = 10 * cellSizeScaled; }
    const screenX = selectionStart.x * cellSizeScaled + offsetX;
    const screenY = selectionStart.y * cellSizeScaled + offsetY;
    selectionOverlay.style.left = screenX + 'px';
    selectionOverlay.style.top = screenY + 'px';
    selectionOverlay.style.width = overlayWidth + 'px';
    selectionOverlay.style.height = overlayHeight + 'px';
    selectionOverlay.style.display = 'block';
    selectionOverlay.style.borderColor = '#00d4ff';
    selectionOverlay.style.background = 'rgba(0, 212, 255, 0.1)';
}

// ─── Coords Display ───
function updateCoords(mouseX, mouseY) {
    const cellSizeScaled = CELL_SIZE * zoom;
    const cellX = Math.floor((mouseX - offsetX) / cellSizeScaled);
    const cellY = Math.floor((mouseY - offsetY) / cellSizeScaled);
    const cell = { x: Math.max(0, Math.min(GRID_SIZE - 1, cellX)), y: Math.max(0, Math.min(GRID_SIZE - 1, cellY)) };
    const modeNames = {
        'space-station': '空间站', 'building': '建筑', 'building-10': '10×10建筑', 'building-20': '20×20建筑',
        'plan-circle': '计划圈-' + selectedPlanCircleType, 'delegation-circle': '委派圈', 'warp-circle': '曲率圈',
        'marker': '标记', 'marker-rally': '标记-集合点', 'marker-resource': '标记-资源点', 'marker-transit': '标记-中转点',
        'marker-attack': '标记-进攻点', 'marker-caution': '标记-注意点', 'marker-defense': '标记-防御点',
        'route-curve': '曲速', 'route-normal': '普通航线', 'text': '文字', 'move': '移动'
    };
    coordsDisplay.textContent = '位置: (' + cell.x + ', ' + cell.y + ') | 缩放: ' + Math.round(zoom * 100) + '% | 模式: ' + modeNames[currentMode];
}

// ─── Move Item ───
function moveItem(item, dx, dy) {
    switch (item.type) {
        case 'plan': plans[item.index].x += dx; plans[item.index].y += dy; break;
        case 'route': routes[item.index].start.x += dx; routes[item.index].start.y += dy; routes[item.index].end.x += dx; routes[item.index].end.y += dy; break;
        case 'marker': markers[item.index].x += dx; markers[item.index].y += dy; break;
        case 'text': texts[item.index].x += dx; texts[item.index].y += dy; break;
    }
}

function syncMoveItem(item) {
    // After moving, sync to server
    switch (item.type) {
        case 'plan': sendMessage({ type: 'move_plan', index: item.index, x: plans[item.index].x, y: plans[item.index].y }); break;
        case 'marker': sendMessage({ type: 'move_marker', index: item.index, x: markers[item.index].x, y: markers[item.index].y }); break;
        case 'text': sendMessage({ type: 'move_text', index: item.index, x: texts[item.index].x, y: texts[item.index].y }); break;
    }
}

function updatePlanTypeOptions(mode) {
    const planTypeSelect = document.getElementById('planType');
    planTypeSelect.innerHTML = '';
    let types = [];
    if (mode === 'building' || mode === 'building-10') types = PLAN_TYPES['building'].types10;
    else if (mode === 'building-20') types = PLAN_TYPES['building'].types20;
    else if (mode === 'plan-circle') types = PLAN_TYPES['plan-circle'].types;
    else if (mode === 'building') types = [...PLAN_TYPES['building'].types10, ...PLAN_TYPES['building'].types20];
    types.forEach(type => {
        const option = document.createElement('option');
        option.value = type; option.textContent = type;
        planTypeSelect.appendChild(option);
    });
}

function getDefaultTypeName(mode) {
    if (mode === 'plan-circle') return '普通计划圈';
    if (mode === 'delegation-circle') return '委派圈';
    if (mode === 'warp-circle') return '曲率圈';
    return '';
}

function addPlanAtCoord(coord, mode, typeName) {
    const planConfig = PLAN_TYPES[mode] || { canOverlap: true };
    let plan = { x: coord.x, y: coord.y, color: currentColor, name: typeName || '', type: typeName || getDefaultTypeName(mode), docking: '', note: '', canOverlap: planConfig.canOverlap };
    if (mode === 'plan-circle') { plan.shape = 'circle'; plan.radius = 5; plan.x = coord.x - plan.radius; plan.y = coord.y - plan.radius; }
    else if (mode === 'delegation-circle') { plan.shape = 'delegation'; plan.radius = 15; plan.x = coord.x - plan.radius; plan.y = coord.y - plan.radius; }
    else if (mode === 'warp-circle') { plan.shape = 'warp'; plan.direction = 0; }
    else if (mode === 'marker') {
        const m = { x: coord.x, y: coord.y, type: 'rally', color: currentColor, name: typeName || '' };
        markers.push(m);
        sendMessage({ type: 'place_marker', marker: m });
        return;
    }
    plans.push(plan);
    sendMessage({ type: 'place_plan', plan });
}

function confirmPlan() {
    const name = document.getElementById('planName').value;
    const docking = document.getElementById('planDocking').value;
    const note = document.getElementById('planNote').value;
    const editIndex = parseInt(document.getElementById('editPlanIndex').value);
    const planMode = document.getElementById('planMode').value;

    let type;
    if (editIndex >= 0) {
        const existingPlan = plans[editIndex];
        if (existingPlan.shape === 'square' && existingPlan.width >= 40) type = '空间站';
        else if (existingPlan.shape === 'delegation') type = '委派圈';
        else if (existingPlan.shape === 'warp') type = '曲率圈';
        else type = document.getElementById('planType').value;
    } else {
        if (planMode === 'space-station') type = '空间站';
        else if (planMode === 'delegation-circle') type = '委派圈';
        else if (planMode === 'warp-circle') type = '曲率圈';
        else type = document.getElementById('planType').value;
    }
    if (!type) { alert('请选择计划类型'); return; }

    if (editIndex >= 0) {
        const plan = plans[editIndex];
        plan.name = name; plan.type = type; plan.docking = docking; plan.note = note;
        if (plan.shape === 'warp') plan.direction = parseFloat(document.getElementById('planDirection').value);
        if (plan.shape === 'square' && plan.width >= 40) {
            plan.width = Math.max(40, Math.round(parseInt(document.getElementById('planWidth').value || 40) / 10) * 10);
            plan.height = Math.max(40, Math.round(parseInt(document.getElementById('planHeight').value || 40) / 10) * 10);
        }
        sendMessage({ type: 'edit_plan', index: editIndex, plan: JSON.parse(JSON.stringify(plan)) });
    } else {
        if (!requirePermission('place')) { document.getElementById('planModal').classList.remove('show'); return; }
        const { cell, mode } = pendingPlan;
        const planConfig = PLAN_TYPES[mode];
        let plan = { x: cell.x, y: cell.y, color: currentColor, name, type, docking, note, canOverlap: planConfig.canOverlap };

        if (mode === 'space-station') {
            plan.shape = 'square';
            plan.width = Math.max(40, Math.round(parseInt(document.getElementById('planWidth').value || 40) / 10) * 10);
            plan.height = Math.max(40, Math.round(parseInt(document.getElementById('planHeight').value || 40) / 10) * 10);
            pendingSpaceStationSize = { width: plan.width, height: plan.height };
            pendingPlan = { cell, size: Math.max(plan.width, plan.height), mode };
            document.getElementById('planModal').classList.remove('show');
            pendingPlan = null; editingPlanIndex = -1;
            drawGrid();
            return;
        } else if (mode === 'building' || mode === 'building-10' || mode === 'building-20') {
            plan.shape = 'square';
            plan.width = mode === 'building-20' ? 20 : 10;
            plan.height = plan.width;
        } else if (mode === 'plan-circle') {
            plan.shape = 'circle'; plan.radius = 5;
            plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius;
        } else if (mode === 'delegation-circle') {
            plan.shape = 'delegation'; plan.radius = 15;
            plan.x = cell.x - plan.radius; plan.y = cell.y - plan.radius;
        } else if (mode === 'warp-circle') {
            plan.shape = 'warp';
            plan.direction = parseFloat(document.getElementById('planDirection').value);
        }

        if (checkOverlap(plan)) { alert('该位置与其他计划重叠，请选择其他位置'); return; }
        plans.push(plan);
        sendMessage({ type: 'place_plan', plan: JSON.parse(JSON.stringify(plan)) });
    }

    document.getElementById('planModal').classList.remove('show');
    pendingPlan = null; editingPlanIndex = -1;
    drawGrid();
}

function openTextModal(cell) {

    pendingTextPos = cell;
    document.getElementById('textContent').value = '';
    document.getElementById('textSize').value = '14';
